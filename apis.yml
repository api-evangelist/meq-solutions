name: MEQ Solutions
description: MEQ Solutions is an Australian agrifood technology company delivering what it calls the
  world's only end-to-end measurement of red meat quality and yield. Its integrated hardware-and-software
  suite — MEQ Probe, MEQ Camera, MEQ Live, and MEQ Insights — gives producers, feedlots, processors,
  brands, retailers, and food-service operators objective, real-time carcass and eating-quality data.
  Deployed across Australia, New Zealand, the United States, and Brazil, MEQ has completed over 10 million
  scans across 60+ deployments and reports a demonstrated 10x ROI. The company is backed by Insight Partners.
  No public developer API surface is currently published; the meqinsights.com portal is a customer login.
